name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest 
    
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Ortamini Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Bagimliliklari Yukle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pybind11 pyinstaller

    - name: MSVC Derleyici Ortamini Kur
      uses: ilammy/msvc-dev-cmd@v1

    - name: C++ Motorunu Windows Icin Derle
      run: |
        mkdir build
        cd build
        $PYBIND_DIR = python -c "import pybind11; print(pybind11.get_cmake_dir())"
        cmake -Dpybind11_DIR="$PYBIND_DIR" ..
        cmake --build . --config Release
      shell: pwsh 

    - name: PyInstaller ile Executable Olustur
      run: |
        New-Item -ItemType Directory -Force -Path data
        pyinstaller --noconfirm --onedir --windowed `
          --add-data "data;data/" `
          --add-data "build/Release/dentMirrorCore*.pyd;build/" `
          app/baslangic.py
      shell: pwsh

    - name: Windows Surumunu Yayinla
      uses: actions/upload-artifact@v4
      with:
        name: DentMirror-Windows-Build
        path: dist/baslangic/